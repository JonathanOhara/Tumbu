# Resource groups for TUMBU (Ogre 14). Paths are relative to this file, which is copied next to TUMBU.exe
# (bin/<Config>); ../../media is the repo's media folder. OgreMedia/ and MyGUI_Media/ are copied by the build.

# Ogre's own shaders and materials (core, shader generator, terrain).
[OgreInternal]
FileSystem=OgreMedia/Main
FileSystem=OgreMedia/RTShaderLib
FileSystem=OgreMedia/Terrain

[Essential]
Zip=OgreMedia/packs/SdkTrays.zip

# The game's shared media lives in General, the default group Ogre 14 uses for lookups like setSkyDome.
[General]
FileSystem=../../media/fonts
FileSystem=../../media/materials/scripts
FileSystem=../../media/materials/textures
FileSystem=../../media/musics
FileSystem=../../media/sounds
FileSystem=../../media/images
FileSystem=../../media/configuration

[Game]
FileSystem=../../media/scenes/arena
FileSystem=../../media/particle
FileSystem=../../media/tumbu/arena
FileSystem=../../media/tumbu/others
FileSystem=../../media/tumbu/robots
FileSystem=../../media/tumbu/robot001
FileSystem=../../media/tumbu/robot002
FileSystem=../../media/tumbu/robot003
FileSystem=../../media/tumbu/robot004
FileSystem=../../media/tumbu/robot005

[Plants]
FileSystem=../../media/plants

[TerrainTextures]
FileSystem=../../media/TerrainTextures

[General]
FileSystem=../../media
FileSystem=../../media/scenes/arena/Terrain

# Caelum day/night sky ("High" sky quality). CaelumMedia/ is copied by the build.
[Caelum]
FileSystem=CaelumMedia

# GUI (MyGUI): its base skins/fonts plus the game's own layouts and images.
[MyGUI]
FileSystem=MyGUI_Media
FileSystem=../../media/gui
FileSystem=../../media/fonts
